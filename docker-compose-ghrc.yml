services:
  postgres-blue:
    image: postgres:17-alpine
    restart: always
    environment:
      POSTGRES_DB: klinok
      POSTGRES_USER: klinok
      POSTGRES_PASSWORD: ${KLINOK_POSTGRES_PASSWORD:?KLINOK_POSTGRES_PASSWORD must be set}
    volumes:
      - ${KLINOK_POSTGRES_DATA_DIR:-/srv/klinok/postgres.v3/data}:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U klinok -d klinok"]
      interval: 10s
      timeout: 5s
      retries: 10

  api-blue:
    image: ghcr.io/maxirmx/klinok.api-node:${KLINOK_IMAGE_TAG:-latest}
    restart: always
    depends_on:
      postgres-blue:
        condition: service_healthy
    environment:
      KLINOK_DATABASE_URL: postgres://klinok:${KLINOK_POSTGRES_PASSWORD}@postgres-blue:5432/klinok
      KLINOK_PUBLIC_ORIGIN: https://${KLINOK_DOMAIN:-klinok.sw.consulting}
      KLINOK_COOKIE_SECURE: "true"
      KLINOK_ENFORCE_ORIGIN: "true"
      KLINOK_TRUST_PROXY: "uniquelocal"
      KLINOK_BOOTSTRAP_ACCOUNT_ID: ${KLINOK_BOOTSTRAP_ACCOUNT_ID:-bootstrap-administrator}
      KLINOK_SMTP_HOST: ${KLINOK_SMTP_HOST:-mail.nic.ru}
      KLINOK_SMTP_PORT: ${KLINOK_SMTP_PORT:-465}
      KLINOK_SMTP_SECURE: ${KLINOK_SMTP_SECURE:-true}
      KLINOK_SMTP_USER: ${KLINOK_SMTP_USER:-}
      KLINOK_SMTP_PASSWORD: ${KLINOK_SMTP_PASSWORD:-}
      KLINOK_SMTP_FROM: ${KLINOK_SMTP_FROM:-Клинок <noreply@klinok.sw.consulting>}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8090/readyz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      default:
        aliases:
          - api

  ui-blue:
    image: ghcr.io/maxirmx/klinok.ui:${KLINOK_IMAGE_TAG:-latest}
    restart: always
    depends_on:
      api-blue:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    environment:
      KLINOK_BOOTSTRAP_ACCOUNT_ID: ${KLINOK_BOOTSTRAP_ACCOUNT_ID:-bootstrap-administrator}
      KLINOK_OFFLINE_LEASE_DAYS: ${KLINOK_OFFLINE_LEASE_DAYS:-7}
    volumes:
      - ${KLINOK_CERTIFICATE_DIR:-/srv/klinok/certificate}:/etc/nginx/certificate:ro
    networks:
      default:
        aliases:
          - ui

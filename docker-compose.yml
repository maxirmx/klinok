services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: klinok
      POSTGRES_USER: klinok
      POSTGRES_PASSWORD: ${KLINOK_POSTGRES_PASSWORD:-klinok-local-password}
    volumes:
      - postgres-v3:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U klinok -d klinok"]
      interval: 2s
      timeout: 3s
      retries: 30

  mail:
    image: axllent/mailpit:v1.27
    ports:
      - "${KLINOK_MAILPIT_PORT:-8025}:8025"

  api:
    build:
      context: .
      dockerfile: api-node/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      mail:
        condition: service_started
    environment:
      KLINOK_DATABASE_URL: postgres://klinok:${KLINOK_POSTGRES_PASSWORD:-klinok-local-password}@postgres:5432/klinok
      KLINOK_PUBLIC_ORIGIN: http://localhost:${KLINOK_UI_PORT:-8080}
      KLINOK_COOKIE_SECURE: "false"
      KLINOK_TRUST_PROXY: "1"
      KLINOK_SMTP_HOST: mail
      KLINOK_SMTP_PORT: "1025"
      KLINOK_BOOTSTRAP_ACCOUNT_ID: bootstrap-administrator
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8090/readyz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 2s
      timeout: 3s
      retries: 30

  ui:
    build: .
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${KLINOK_UI_PORT:-8080}:80"
    volumes:
      - ./config/nginx.local.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  postgres-v3:
